[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "tcm-cvd-rag-service"
version = "0.1.0"
description = "LlamaIndex based retrieval service for the TCM cardiovascular RAG prototype"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1",
    "llama-index-core>=0.12,<0.16",
    "llama-index-retrievers-bm25>=0.4,<0.7",
    "pydantic>=2.9,<3",
    "uvicorn[standard]>=0.30,<1",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.27,<1",
    "pytest>=8,<10",
]
llm = [
    "llama-index-llms-openai-like>=0.3,<0.7",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

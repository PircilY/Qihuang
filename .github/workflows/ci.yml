name: ci

on:
  push:
  pull_request:

jobs:
  python-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rag-service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements-dev.txt
      - run: python ../tools/build_corpus.py --check
      - run: python ../tools/import_knowledge.py --audit --report ../docs/knowledge-base.md --check
      - run: python ../tools/import_knowledge.py ../tools/fixtures/import.jsonl --output ../tools/fixtures/generated --redact --check
      - run: pytest -q

  java-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      - run: mvn -q test
        working-directory: backend

  integration-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r rag-service/requirements-lock.txt
      - run: mvn -q -f backend/pom.xml -DskipTests package
      - run: python tools/smoke_e2e.py

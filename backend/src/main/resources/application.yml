spring:
  application:
    name: tcm-cvd-rag-prototype
  jackson:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false

server:
  forward-headers-strategy: framework
  port: ${SERVER_PORT:8080}
  address: ${SERVER_ADDRESS:127.0.0.1}
  shutdown: graceful
  servlet:
    session:
      timeout: 30m
      cookie:
        http-only: true
        same-site: strict

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-components: always
      show-details: always

app:
  experiments:
    enabled: ${GENERATION_EXPERIMENT_ENABLED:false}
    max-cases: ${GENERATION_EXPERIMENT_MAX_CASES:50}
    judge-enabled: ${JUDGE_ENABLED:false}
    judge-base: ${JUDGE_API_BASE:}
    judge-model: ${JUDGE_MODEL:}
    judge-key: ${JUDGE_API_KEY:}
    judge-temperature: ${JUDGE_TEMPERATURE:0}
  limits:
    import-requests-per-minute: ${IMPORT_REQUESTS_PER_MINUTE:30}
    evaluation-requests-per-minute: ${EVALUATION_REQUESTS_PER_MINUTE:2}
    evaluation-max-characters: ${EVALUATION_MAX_CHARACTERS:100000}
    evaluation-max-cases: ${EVALUATION_MAX_CASES:200}
  model:
    api-base: ${MODEL_API_BASE:}
    name: ${MODEL_NAME:}
    api-key: ${MODEL_API_KEY:}
    timeout: ${MODEL_TIMEOUT:60s}
    allowed-base-urls: ${MODEL_ALLOWED_BASE_URLS:https://api.deepseek.com/v1,https://api.deepseek.com,https://dashscope.aliyuncs.com/compatible-mode/v1,https://api.openai.com/v1}
  knowledge:
    max-import-documents: ${KNOWLEDGE_MAX_IMPORT_DOCUMENTS:1000}
    max-import-characters: ${KNOWLEDGE_MAX_IMPORT_CHARACTERS:10000000}
    store-path: ${KNOWLEDGE_STORE_PATH:./runtime/knowledge-imports.json}
  rag-engine:
    mode: ${RAG_ENGINE_MODE:auto}
    base-url: ${RAG_SERVICE_URL:http://127.0.0.1:8000}
    connect-timeout: ${RAG_CONNECT_TIMEOUT:500ms}
    read-timeout: ${RAG_READ_TIMEOUT:30s}
    fallback-to-local: ${RAG_FALLBACK_TO_LOCAL:true}
    retry-interval: ${RAG_RETRY_INTERVAL:10s}
    sync-batch-size: ${RAG_SYNC_BATCH_SIZE:20}
  retrieval:
    candidate-limit: 8
    final-limit: 4
    rrf-rank-constant: 60
    lexical-weight: 1.0
    vector-weight: 0.85
    normalized-fusion: ${RAG_NORMALIZED_FUSION:true}
    metadata-weight: ${RAG_METADATA_WEIGHT:0.0}
    minimum-evidence-score: ${RAG_MINIMUM_EVIDENCE_SCORE:0.9}
    query-bridge: ${RAG_QUERY_BRIDGE:false}

logging:
  level:
    root: INFO
    com.tcm.ragassistant: INFO


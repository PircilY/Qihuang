spring:
  application:
    name: tcm-cvd-rag-prototype
  jackson:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false

server:
  port: ${SERVER_PORT:8080}
  address: ${SERVER_ADDRESS:127.0.0.1}
  shutdown: graceful
  servlet:
    session:
      timeout: 30m
      cookie:
        http-only: true
        same-site: strict

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never

app:
  model:
    api-base: ${MODEL_API_BASE:}
    name: ${MODEL_NAME:}
    api-key: ${MODEL_API_KEY:}
    timeout: ${MODEL_TIMEOUT:60s}
    allowed-base-urls: ${MODEL_ALLOWED_BASE_URLS:https://api.deepseek.com/v1,https://api.deepseek.com,https://dashscope.aliyuncs.com/compatible-mode/v1,https://api.openai.com/v1}
  knowledge:
    store-path: ${KNOWLEDGE_STORE_PATH:./runtime/knowledge-imports.json}
  rag-engine:
    mode: ${RAG_ENGINE_MODE:auto}
    base-url: ${RAG_SERVICE_URL:http://127.0.0.1:8000}
    connect-timeout: ${RAG_CONNECT_TIMEOUT:500ms}
    read-timeout: ${RAG_READ_TIMEOUT:30s}
    fallback-to-local: ${RAG_FALLBACK_TO_LOCAL:true}
    retry-interval: ${RAG_RETRY_INTERVAL:10s}
  retrieval:
    candidate-limit: 8
    final-limit: 4
    rrf-rank-constant: 60
    lexical-weight: 1.0
    vector-weight: 0.85
    minimum-evidence-score: 0.016

logging:
  level:
    root: INFO
    com.tcm.ragassistant: INFO

